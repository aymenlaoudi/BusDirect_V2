<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect</title>
    <link rel="stylesheet" href="style.css">
    <link href="src/output.css" rel="stylesheet">
</head>

<body>

    <header class="bg-white shadow-sm sticky top-0 z-10 ">
        <section class="mx-auto p-4 flex justify-between items-center">
            <div class="flex gap-2 items-center">
                <img src="img/logo.png" alt="logo" class="w-[50px] h-[40px]">
                <h1 class="text-xl font-bold text-sky-900">
                    <a href="#bus_direct">BusDirect</a>
                </h1>
            </div>
            <nav class="flex gap-5 items-center">
                <a class="text-l font-medium text-cyan-700 hover:text-sky-900" href="#reservation">
                    Reservation
                </a>

                <a class="text-2xl" href="#ticket" aria-label="Panier">
                    🛒
                </a>
            </nav>

        </section>
    </header>
    <main class="max-w-6xl mx-auto px-4 my-6 flex flex-col gap-6">

        <section class="rounded-2xl bg-white p-5 shadow-sm ">

            <div class="flex flex-wrap items-center justify-between gap-4">

                <div class="flex items-center gap-4">
                    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-sky-100">
                        <img src="img/trajet.png" alt="trajet" class="h-7 w-7">
                    </div>
                    <div>
                        <p class="text-xs font-medium uppercase tracking-wide text-slate-400">Trajet</p>
                        <h2 class="text-xl font-semibold text-slate-800 sm:text-2xl">
                            Safi → Marrakech
                        </h2>
                    </div>
                </div>

                <span class="rounded-xl bg-sky-50 px-4 py-1 text-sm font-semibold text-sky-700 ring-1 ring-sky-100">
                    80 DH / place
                </span>

            </div>

            <div
                class="mt-5 flex flex-wrap items-center justify-end gap-x-5 gap-y-2 border-t border-slate-100 pt-4 text-sm text-slate-600">
                <div class="flex-1 flex min-w-40 items-center justify-end gap-2">
                    <div class="w-3 h-3 bg-green-600 rounded-sm"></div>
                    <p class="text-cyan-900 text-sm font-medium">
                        Libre
                    </p>
                    <div class="w-3 h-3 bg-gray-200 rounded-sm"></div>
                    <p class="text-cyan-900 text-sm font-medium">
                        ocuupé
                    </p>
                </div>
            </div>
        </section>
        <section class="rounded-2xl bg-white p-5 shadow-sm flex justify-around">
            <div>
                <p class="font-semibold">Places Disponible :</p>
                <span id="places" class="font-medium"></span>
            </div>
            <div>
                <p class="font-semibold">Prix Total :</p>
                <span id="prix" class="font-medium"></span>
            </div>
        </section>


        <div class="page">
            <section class="bg-blue-50 rounded-2xl shadow-xl p-4">
                <div class="bg-white rounded-xl p-3 mb-4 font-medium">Driver 🧑‍✈️</div>
                <div id="seatGrid" class="grid grid-cols-[1fr_1fr_0.3fr_1fr_1fr] gap-2"></div>
            </section>
            <div class="forms">
                <section class="bg-white rounded-2xl shadow-xl p-6 h-fit ">
                    <h2 class="text-lg font-semibold mb-4">Reserver une place</h2>
                    <label for="nameInput" class="block text-sm font-medium rond mb-1">Passager :</label>
                    <input type="text" id="nameInput" placeholder="e.g. Aymen L"
                        class="w-full border border-slate-300 rounded-lg p-2 bg-[#F0F4FF] px-3 py-2 mb-4 ">
                    <div>
                        <label for="" class="block text-sm font-medium mb-1 rond">Choisir un siège</label>
                        <div class="flex items-center gap-4 justify-between">
                            <input type="text" id="seatInput" placeholder="-- N° de Siège --"
                                class="w-full border border-slate-300 rounded-lg p-2 bg-[#F0F4FF] px-3 py-2">
                            <button type="button" id="reserveButton"
                                class="border-1 px-3 py-2 rounded-xl bg-[#0039A6] text-white">Confirmer</button>
                        </div>
                    </div>
                    <p id="message" class="mt-4 text-sm font-medium"></p>
                </section>

                <section
                    class="flex shadow-xl w-full rounded-xl gap-3 p-4 flex-wrap flex-col bg-white shadow-sm p-4 pb-7">
                    <div>
                        <h2 class="text-lg font-semibold mb-4">Modifier une place</h2>
                    </div>
                    <div>
                        <label for="changeSelect" class="block text-sm font-medium mb-1 rond">Passager existant</label>
                        <select id="changeSelect"
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-4 bg-[#F0F4FF] focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </select>
                    </div>
                    <div>
                        <label for="name" class="block text-sm font-medium rond mb-1">Nom du passager :</label>
                        <input type="text" name="name" id="modifyNameInput" placeholder="Modifier le nom"
                            class="w-full border border-slate-300 rounded-lg p-2 bg-[#F0F4FF] px-3 py-2">
                    </div>
                    <div>
                        <label for="newSeat" class="block text-sm font-medium mb-1 rond">Nouveau siège</label>
                        <div class="flex items-center gap-4 justify-between">
                            <input type="text" id="newSeat" placeholder="-- Siège --"
                                class="w-full border border-slate-300 rounded-lg p-2 bg-[#F0F4FF] px-3 py-2">
                            <button type="button" id="modifyBtn"
                                class="border-1 px-3 py-2 rounded-xl bg-blue-100 text-blue-800 font-medium">Modifier</button>
                        </div>
                    </div>
                    <p id="modifyMessage" class="mt-4 text-sm font-medium"></p>
                </section>
                <section
                    class="flex shadow-xl w-full rounded-xl gap-3 p-4 flex-wrap flex-col bg-white shadow-sm p-4 pb-7 ">
                    <div>
                        <h2 class="text-lg font-semibold mb-4">Supprimer une reservation</h2>
                    </div>

                    <div>
                        <label for="supSelect" class="block text-sm font-medium mb-1 rond">Passager réservé</label>
                    </div>
                    <div class="flex items-center gap-4 justify-between">
                        <select id="supSelect"
                            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-[#F0F4FF] focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </select>
                        <div class="flex items-center gap-4 justify-between">
                            <button type="button" id="supBtn"
                                class="border-1 px-3 py-2 rounded-xl bg-red-200 text-red-600 font-medium">Supprimer</button>
                        </div>
                    </div>
                    <p id="supMessage" class="mt-4 text-sm font-medium"></p>
                </section>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
